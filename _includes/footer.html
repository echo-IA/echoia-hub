<footer id="footer">
  {%- if site.site_logo -%}
  <div class="footer-brand">
    <a href="{{ '/' | relative_url }}" aria-label="{{ site.title | default: 'Home' }}">
      <img
        src="{{ site.site_logo | relative_url }}"
        alt="{{ site.title | default: 'Site' }} logo"
        loading="lazy"
        height="44"
        width="auto"
      />
    </a>
  </div>
  {%- endif -%}

  {% include copyright.html
      owner=site.owner
      author_credit_html=site.author_credit_html
      image_credit_md=page.image_credit_md
  %}
</footer>
