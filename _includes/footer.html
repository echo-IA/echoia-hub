<!-- _includes/footer.html -->
<footer id="footer">
  {%- if site.site_logo -%}
  <div class="footer-brand">
    <a href="{{ '/' | relative_url }}" aria-label="{{ site.title | default: 'Home' }}">
      <img
        src="{{ site.site_logo | relative_url }}"
        alt="{{ site.title | default: 'Site' }} logo"
        loading="lazy"
        height="28"
      />
    </a>
  </div>
  {%- endif -%}

  {% include copyright.html owner=site.owner %}
</footer>
